name: dvoinoe-dno
on:
  push:
    paths: ['dvoinoe-dno/**', '.github/workflows/dvoinoe-dno.yml']
  pull_request:
    paths: ['dvoinoe-dno/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dvoinoe-dno
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dvoinoe-dno/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --trace off
