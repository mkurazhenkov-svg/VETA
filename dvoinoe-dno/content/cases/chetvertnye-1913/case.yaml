variants:
  - id: truth_main
    title: Основной
    summary: Ветлугин организовал, Скобцов изготовлял, меняла Гуров сбывал, хозяйка покрывала за надбавку.
    roles: { vetlugin: organizer, skobtsov: maker, gurov: seller, kukushkina: concealer, pyzhov: none, mitrofan: none, mokhov: none }
    fugitive: vetlugin
    reveal:
      - Ночью Скобцов печатал очередную пробу, и Ветлугин, торопясь, поджёг магний, чтобы снять лист для сверки. Вспышка, дым, крики соседей.
      - Ветлугин схватил деньги, сунул квитанцию в карман старого пальто — и бросил пальто вместе с багажом. С первым гудком он был на пристани.
      - Скобцов ушёл раньше, к Нижнему базару, в ночлежку. Хозяйка видела обоих — и промолчала, как молчала всё лето за пять рублей надбавки.
    proofs:
      vetlugin: [[f_receipt_vetlugin, f_kukushkina_admits], [f_receipt_vetlugin, f_gurov_admits]]
      skobtsov: [[f_prints_match], [f_tools_as, f_skobtsov_confession]]
      gurov: [[f_book_match], [f_gurov_admits]]
      kukushkina: [[f_kukushkina_admits]]
    workshopLink: [f_paint_match, f_stone_ornament, f_negative_bill, f_sample_number_match, f_proof_number]
    reference:
      protocolPoints:
        - Описание помещения с порога, обзорные снимки до входа
        - Выяснено у околоточного, что он менял до осмотра
        - Ключевые предметы сняты до изъятия, с масштабом
        - Оттиски из печи — на жёсткую подложку под стекло
        - Пресс опечатан на месте, образец краски снят на бумагу
        - Ложные следы отделены и описано их происхождение
        - Понятые — водовоз Ершов и лавочник Сычёв (или замена), без кума хозяйки
      examination:
        ev_bank_fakes: Экспедиция заготовления государственных бумаг — вопрос о способе изготовления и общем источнике
        ev06_prints: Сыскное отделение (картотека) — сравнение со Скобцовым
      telegram: До 17:00 — в Козьмодемьянск, приметы «господина в котелке», пароход «Волжанин»
  - id: truth_landlord
    title: «Подставной хозяин»
    summary: Ветлугин лишь сдавал подвал. Мастерскую держал Скобцов, а околоточный за долю закрывал глаза.
    roles: { vetlugin: none, skobtsov: organizer, gurov: seller, kukushkina: concealer, pyzhov: patron, mitrofan: none, mokhov: none }
    fugitive: null
    reveal:
      - Ветлугин ещё весной сдал подвал «переплётчику» Скобцову и почти не спускался туда. Утренним пароходом он уехал по своим делам — закупать пластинки в Казани.
      - Скобцов работал по ночам. Околоточный Пыжов знал и раз в неделю заходил «за долей».
      - Когда ночью полыхнул магний, Пыжов прибежал первым — и унёс из подвала свёрток бумаг, где было письмо о сдаче подвала. «На сохранность».
    proofs:
      skobtsov: [[f_prints_match], [f_sublet_letter], [f_skobtsov_confession]]
      pyzhov: [[f_pyzhov_visits, f_dvornik_pyzhov_bundle], [f_pyzhov_visits, f_pyzhov_papers_hidden]]
      gurov: [[f_book_match], [f_gurov_admits]]
      kukushkina: [[f_kukushkina_admits]]
    workshopLink: [f_paint_match, f_stone_ornament, f_negative_bill, f_sample_number_match, f_proof_number]
    reference:
      protocolPoints:
        - Изменения обстановки от околоточного — не небрежность, а сокрытие; записать дословно
        - Бумаги, вынесенные околоточным, истребовать и описать
        - Ключевые предметы сняты до изъятия, с масштабом
      examination:
        ev_bank_fakes: Экспедиция заготовления государственных бумаг
        ev06_prints: Сыскное отделение (картотека) — сравнение со Скобцовым
      telegram: Ветлугин не скрывается — телеграмма не обязательна
  - id: truth_guest
    title: «Гастролёр»
    summary: Подвал на ярмарку снял приезжий мастер; местные только сбывали. Штихели с инициалами — подброшены.
    roles: { vetlugin: none, skobtsov: none, gurov: seller, kukushkina: concealer, pyzhov: none, mitrofan: none, mokhov: organizer }
    fugitive: mokhov
    reveal:
      - Ветлугин с июня в отъезде; хозяйка тайком сдала подвал на ярмарку приезжему «переплётчику» Мохову.
      - Мохов работал один и предусмотрительно подбросил в стол чужие штихели с выбитыми буквами «А. С.» — инициалами известного полиции гравёра.
      - После вспышки он ушёл первым пароходом, бросив пальто. Скобцов всю ночь был в ночлежке — это видели десятки людей.
    proofs:
      mokhov: [[f_receipt_mokhov, f_kukushkina_admits], [f_receipt_mokhov, f_gurov_admits]]
      gurov: [[f_book_match], [f_gurov_admits]]
      kukushkina: [[f_kukushkina_admits]]
    workshopLink: [f_paint_match, f_stone_ornament, f_negative_bill, f_sample_number_match, f_proof_number]
    reference:
      protocolPoints:
        - Инструмент с инициалами описать, но не делать выводов о владельце
        - Проверить алиби Скобцова в ночлежке
        - Ключевые предметы сняты до изъятия, с масштабом
      examination:
        ev_bank_fakes: Экспедиция заготовления государственных бумаг
        ev06_prints: Сыскное отделение (картотека) — сравнение; результат отрицательный
      telegram: До 17:00 — в Козьмодемьянск, приметы «господина в котелке», пароход «Волжанин»
