# «Дело о фальшивых четвертных», август 1913. Люди, адреса и события вымышлены.
# Эпоха, город, учреждения и предметы — правдоподобны; их сверяет музей (TODO(музей) в тексте).
id: chetvertnye-1913
title: Дело о фальшивых четвертных
date: "16 августа 1913 года"   # TODO(музей): сроки ярмарки 1913 г.
startTime: "8:30"
endTime: "20:00"
intro:
  - Август 1913 года, разгар Нижегородской ярмарки.
  - Меняла сдаёт в ярмарочную кассу Государственного банка пачку «четвертных». Кассиру-контролёру не нравится бумага на ощупь, а в лупу видно, что сетка расплывается.
  - В ту же ночь в подвале дома на Миллионке, где работает «Фотография и переплётная И. Ветлугина», — вспышка и задымление. Прибежавший околоточный видит печатный пресс и стопки нарезанной бумаги. Хозяин исчез.
  - Утром судебному следователю поручено связать фальшивки с подвалом и найти тех, кто их делал и сбывал.
