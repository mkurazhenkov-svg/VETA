# Карточки «1913 → сегодня» для разбора.
# Номера статей УПК РФ взяты из ТЗ; формулировки — пересказ, не цитата.
# TODO(кафедра): проверить и уточнить каждую карточку.
cards:
  - id: bt_witnesses_or_video
    title: Понятые или техническая фиксация
    norm: "ч. 1.1 ст. 170 УПК РФ"
    text: Сегодня понятые при осмотре участвуют по усмотрению следователя; если их нет, ход и результаты фиксируются техническими средствами.
    tech: Видеозапись хода осмотра.
    status: черновик — проверить кафедре
  - id: bt_witness_admissible
    title: Кто может быть понятым
    norm: "ст. 60 УПК РФ"
    text: Понятой — незаинтересованное лицо. Не могут быть понятыми участники производства, их близкие и родственники, работники органов, ведущих расследование.
    status: черновик — проверить кафедре
  - id: bt_protocol
    title: Протокол осмотра
    norm: "ст. 176, 177, 180 УПК РФ"
    text: В протоколе описываются действия следователя и всё обнаруженное — в той последовательности, в какой производился осмотр, и в том виде, в каком наблюдалось. Изъятое перечисляется.
    tech: Цифровая план-схема, лазерный дальномер.
    status: черновик — проверить кафедре
  - id: bt_inspection_order
    title: Порядок осмотра
    norm: "ст. 176–177 УПК РФ; методика криминалистики"
    text: "Тактика та же, что в 1913 году: от общего к частному, сначала фиксация, потом изменение положения предметов; выясняют, кто был на месте до прибытия группы."
    status: черновик — проверить кафедре
  - id: bt_photo
    title: Фотосъёмка на месте
    norm: "ст. 166, 168, 58 УПК РФ"
    text: Съёмку ведёт специалист-криминалист по указанию следователя; виды съёмки — ориентирующая, обзорная, узловая, детальная (с масштабом). Снимки прилагаются к протоколу.
    tech: Цифровая съёмка, видеозапись, 3D-сканирование места происшествия.
    status: черновик — проверить кафедре
  - id: bt_packaging
    title: Изъятие и упаковка
    norm: "ст. 177, 81, 82 УПК РФ"
    text: Изъятое упаковывается и опечатывается так, чтобы исключить подмену и порчу; на упаковке — пояснительная надпись и подписи.
    tech: Сейф-пакеты с номером, бирки.
    status: черновик — проверить кафедре
  - id: bt_no_threats
    title: Запрет угроз и давления
    norm: "ч. 4 ст. 164 УПК РФ"
    text: При производстве следственных действий недопустимы насилие, угрозы и иные незаконные меры.
    status: черновик — проверить кафедре
  - id: bt_leading
    title: Наводящие вопросы
    norm: "ч. 2 ст. 189 УПК РФ"
    text: При допросе задавать наводящие вопросы запрещается.
    status: черновик — проверить кафедре
  - id: bt_expertise
    title: Назначение экспертизы
    norm: "ст. 195–199 УПК РФ"
    text: Экспертизу назначает следователь постановлением; денежные знаки исследуют в рамках технико-криминалистической экспертизы документов в государственном экспертном учреждении. Специалист и эксперт — разные фигуры.
    tech: Микроскопия, исследование в УФ- и ИК-лучах, детекторы защитных признаков.
    status: черновик — проверить кафедре
epilogue:
  - "Правила тактики за сто с лишним лет почти не изменились: не менять обстановку, сначала фиксировать, описывать без выводов, звать понятых и сведущих людей."
  - "Изменились нормы и техника: вместо Устава 1864 года — УПК РФ, вместо двенадцати пластинок — цифровая съёмка, вместо картотеки на сто карт — автоматизированные дактилоскопические системы."
  - "А ошибки — те же: тронуть до снимка, подсказать свидетелю ответ, поверить первой версии. Посмотрите, где ошиблись вы."
