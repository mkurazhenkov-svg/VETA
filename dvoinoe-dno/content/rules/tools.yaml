# Техника следователя 1913 года и её современный аналог (для разбора).
# TODO(кафедра): подтвердить состав технических средств губернского следователя в 1913 г.
tools:
  - id: camera
    title: Камера на треноге, стеклянные пластинки, магниевая вспышка
    task: Фотофиксация
    limit: 12 пластинок на подвал; вспышка дымит и слепит, рядом с реактивами запрещена
    today: Цифровая съёмка, видеозапись, 3D-сканирование
    bridgeToday: bt_photo
  - id: lamp
    title: Керосиновая лампа, электрический фонарь
    task: Освещение
    limit: Косой свет — только лампой с пола
    today: Криминалистические источники света
  - id: arshin
    title: Складной аршин, рулетка, компас, карандаш
    task: Измерения и план
    limit: План чертится от руки в записной книжке
    today: Лазерный дальномер, цифровая план-схема
    bridgeToday: bt_protocol
  - id: lupa
    title: Лупа
    task: Следы рук, исследование билета
    limit: Выявление невидимых следов ограничено (состав средств — TODO(кафедра))
    today: Дактилоскопические порошки, плёнки, АДИС
  - id: plaster
    title: Гипс для слепка
    task: Следы ног
    limit: Слепок — только после снимка; 20 игровых минут
    today: Слепочные массы, следокопирующие плёнки
  - id: packing
    title: Конверты, ящики, шпагат, сургуч, печать следователя
    task: Упаковка
    limit: Подписи понятых на каждой упаковке
    today: Сейф-пакеты, бирки, пояснительные надписи
    bridgeToday: bt_packaging
