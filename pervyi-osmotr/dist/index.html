:`Галина Петровна Сомова`,short:`Г. П. Сомова`,role:`соседка, заявитель, 71 год`,color:`#b5677a`,hair:`#cfcfd6`,requiresRights:!0,trust:50,intro:{text:`Ой, товарищ следователь… Я как увидела его утром — чуть сама не упала. Давление теперь…`,emotion:`anxiety`},choices:[{id:`rights`,tags:[`rights`],text:`Галина Петровна, я следователь. Вы вправе не свидетельствовать против себя и близких (ст. 51 Конституции РФ), можете пользоваться помощью адвоката. Объяснение даётся добровольно.`,reply:`Поняла, поняла. Мне скрывать нечего, спрашивайте.`,emotion:`neutral`,trust:10},{id:`story`,tags:[`open`],text:`Расскажите, пожалуйста, всё, что вы видели и слышали — с вечера и до утра.`,reply:`Вечером — часов в девять, а может, полдесятого — слышала за стенкой: ругаются. Виктор Палыч и голос молодой, мужской. Потом стекло зазвенело, как будто у него в квартире. Я подумала — посуду бьют. А утром смотрю — дверь приоткрыта…`,emotion:`anxiety`,facts:[`f_neigh_quarrel`,`f_neigh_glass`]},{id:`time`,tags:[`clarify`],after:`story`,text:`Как вы определили время? Что в этот момент шло по телевизору?`,reply:`Сериал мой кончился, новости начались… Значит, полдесятого. Да, точно, в полдесятого.`,emotion:`neutral`,facts:[`f_neigh_time`]},{id:`touch`,tags:[`clarify`],after:`story`,text:`Что вы делали утром, когда увидели открытую дверь? К чему прикасались?`,reply:`Ручку двери потянула, зашла — и выключатель в прихожей включила. Он там лежит… Я сразу в милицию звонить.`,emotion:`sorrow`,facts:[`f_neigh_touched`]},{id:`keys`,tags:[`clarify`],after:`story`,text:`Кто бывает у Виктора Павловича? У кого есть ключи от квартиры?`,minTrust:55,reply:`Да никто почти. Племянник Кирилл ходит, у него ключ свой. Денег всё просит, Виктор Палыч жаловался.`,replyLow:`Да кто ж его знает, я в чужие дела не лезу.`,emotion:`neutral`,facts:[`f_neigh_keys`]},{id:`smoke`,tags:[`clarify`],after:`story`,text:`Виктор Павлович курит? У него в квартире курят?`,reply:`Что вы! Он астматик, сорок лет как бросил. И гостям не разрешает.`,emotion:`neutral`,facts:[`f_owner_nonsmoker`]},{id:`control`,tags:[`control`],after:`time`,text:`Вы сказали — звон стекла был «в квартире». Почему вы так решили, а не что на улице?`,reply:`Так у меня балкон рядом, через стенку. Если б на улице — с улицы бы слышно было. А это глухо, внутри.`,emotion:`neutral`,facts:[`f_neigh_glass_inside`]},{id:`lead`,tags:[`leading`],text:`Это ведь племянник у него был, да? Его голос?`,reply:`Ну… да, наверное. Наверное, Кирилл. Да, точно он, он всегда кричит.`,emotion:`evasive`,facts:[`f_neigh_leading`]},{id:`press`,tags:[`threat`],text:`Вы что-то скрываете. Будете молчать — пойдёте как соучастница.`,reply:`Да как вам не стыдно! Мне плохо… Я больше ничего говорить не буду.`,emotion:`fear`,trust:-60,close:!0}],present:{f_phone_call:{reply:`Кирюша — это Кирилл и есть, племянник. Он ему звонил часто.`,facts:[]}}},belov:{name:`ст. лейтенант полиции Белов`,short:`ст. л-т Белов`,role:`участковый уполномоченный, прибыл первым`,color:`#3d5a80`,hair:`#5a4632`,requiresRights:!1,trust:50,intro:{text:`Здравия желаю. Прибыл в 07:55, скорая уже была. Потерпевшего увезли.`,emotion:`neutral`},choices:[{id:`report`,tags:[`open`],text:`Доложите подробно, что происходило до нашего прибытия.`,reply:`Ну, прибыл, скорая работала. Осмотрелся, всё нормально, ничего не трогал практически. Соседку опросил в общих чертах.`,emotion:`evasive`},{id:`route`,tags:[`clarify`],text:`Вы место ограждали? Кто и каким путём проходил в квартиру?`,reply:`Не ограждал, не успел. Фельдшера с водителем я провёл… через комнату, они носилки разворачивали. Ну и сами они в прихожей работали.`,emotion:`evasive`,facts:[`f_officer_route`]},{id:`self`,tags:[`clarify`],text:`Вы сами куда-то заходили, к чему-то прикасались?`,minTrust:45,reply:`Ну… в санузел заходил, руки помыл после носилок. Воду открывал. Больше ничего.`,replyLow:`Никуда я не заходил, товарищ следователь.`,emotion:`evasive`,facts:[`f_officer_bath`]},{id:`initial`,tags:[`clarify`],text:`В каком положении были две прихожей: Виктор Павлович падает и ударяется затылком об угол тумбы. Кирилл наступает в кровь.`},{time:`21:35`,text:`Кирилл забирает альбом со стеллажа, моет свою чашку и изнутри разбивает стекло балконной двери, открывает шпингалет.`},{time:`21:50`,text:`Уходит через входную дверь, захлопнуть её не может. Квитанция ГСК выпадает из кармана куртки на вешалке.`},{time:`22:48`,text:`Кирилл приезжает в ГСК «Мотор» и прячет альбом в боксе № 47. Продолжение — в Эпизоде 2.`}],h=`TODO(кафедра): ссылка на норму / учебник`,g={R_NO_GUARD:{title:`Не обеспечена охрана места происшествия`,category:`procedure`,severity:`minor`,penalty:3,explain:`До выезда дайте дежурному указание обеспечить охрану места, по прибытии — оградите его и удалите посторонних.`,source:h},R_BASIS:{title:`Осмотр жилища начат без надлежащего основания`,category:`procedure`,severity:`critical`,penalty:15,explain:`Жилище осматривают с согласия проживающих или по судебному решению, кроме случаев ч. 5 ст. 165 УПК РФ. Соседка и племянник согласие дать не вправе — они не проживают в квартире. Правильный вариант для этой ситуации утверждает кафедра.`,source:`ст. 12, ч. 5 ст. 165, ч. 5 ст. 177 УПК РФ; `+h},R_NO_FIXATION:{title:`Без понятых и без видеофиксации`,category:`procedure`,severity:`critical`,penalty:15,explain:`Если понятые не участвуют, применение технических средств фиксации обязательно (ч. 1.1 ст. 170 УПК РФ).`,source:`ч. 1.1 ст. 170, ст. 177 УПК РФ`},R_VIDEO_GAP:{title:`Изъятие в момент, когда видеозапись не велась (без понятых)`,category:`procedure`,severity:`major`,penalty:6,explain:`При осмотре без понятых ход изъятия должен быть зафиксирован непрерывно. Следите за зарядом аккумулятора.`,source:`ч. 1.1 ст. 170 УПК РФ`},R_NO_INTRO:{title:`Нет вступительного слова на видеозаписи`,category:`documentation`,severity:`minor`,penalty:2,explain:`В начале записи озвучьте дату, время, место, участников и применяемые средства.`,source:h},R_NO_PPE:{title:`Вход на место осмотра без перчаток и бахил`,category:`technique`,severity:`major`,penalty:5,explain:`Средства защиты надевают до входа: иначе вы оставляете свои следы и уничтожаете чужие.`,source:h},R_CHANGES_UNKNOWN:{title:`Не выяснены изменения обстановки до прибытия СОГ`,category:`tactics`,severity:`major`,penalty:5,explain:`Спросите прямо у первого прибывшего (участкового) и медиков, кто где ходил и что трогал. Иначе их следы попадут в протокол как следы преступника.`,source:h},R_TOUCH_BEFORE_PHOTO:{title:`Объект изъят до фиксации исходного положения`,category:`tactics`,severity:`major`,penalty:4,explain:`Сначала обзорная и узловая съёмка, затем изменение положения объекта.`,source:h},R_NO_GLOVES:{title:`Касание объекта без перчаток`,category:`technique`,severity:`major`,penalty:4,explain:`Без перчаток на объекте остаются ваши потожировые следы и биоматериал.`,source:h},R_CROSS_DNA:{title:`Перчатки не сменены между ДНК-объектами`,category:`technique`,severity:`minor`,penalty:2,explain:`Между отбором разных биологических объектов перчатки меняют, чтобы не перенести биоматериал.`,source:h},R_FRAGILE:{title:`След уничтожен: шаг по хрупкой зоне без мостков`,category:`tactics`,severity:`major`,penalty:5,explain:`Определите дорожку движения и используйте переходные мостки там, где могут быть следы.`,source:h},R_DOOR_PRINTS:{title:`Балконная дверь открыта до обработки шпингалета`,category:`tactics`,severity:`major`,penalty:5,explain:`Шпингалет и ручка — вероятные места следов рук. Сначала выявление и изъятие следов, потом — манипуляции с дверью.`,source:h},R_BAD_METHOD:{title:`Неверный способ изъятия`,category:`technique`,severity:`major`,penalty:4,explain:`Способ изъятия должен сохранять признаки следа.`,source:h},R_PACKAGING:{title:`Нарушены правила упаковки`,category:`technique`,severity:`major`,penalty:4,explain:`Упаковка выбирается по типу объекта: биология — сухой в бумагу, электроника — экранирование, стекло — жёсткая тара. Каждый объект — отдельно, опечатан, с пояснительной надписью.`,source:h},R_LABEL:{title:`Неполная пояснительная надпись на упаковке`,category:`documentation`,severity:`minor`,penalty:1,explain:`Что изъято, где, когда, по какому материалу, подписи участников, оттиск печати.`,source:`ст. 177 УПК РФ; `+h},R_POWDER_BEFORE_PHOTO:{title:`Порошок нанесён до фотосъёмки выявленного следа`,category:`technique`,severity:`minor`,penalty:2,explain:`Порядок неразрушающих методов: освещение → фото → порошок → фото → плёнка.`,source:h},R_LIFT_BEFORE_PHOTO:{title:`След скопирован на плёнку без съёмки после проявления`,category:`technique`,severity:`major`,penalty:4,explain:`Проявленный след фотографируют с масштабом до копирования: перенос на плёнку может его исказить.`,source:h},R_WRONG_POWDER:{title:`Порошок не подходит к поверхности`,category:`technique`,severity:`minor`,penalty:2,explain:`Подбирайте порошок по цвету и материалу поверхности; магнитный не применяют на ферромагнитных металлах.`,source:`surfaces — `+h},R_FALSE_FLAG:{title:`Значимый след ошибочно отнесён к следам посторонних`,category:`tactics`,severity:`minor`,penalty:2,explain:`Происхождение следа устанавливают по объяснениям и обстановке, а не по первому впечатлению.`,source:h},R_RIGHTS:{title:`Опрос начат без разъяснения прав`,category:`interview`,severity:`major`,penalty:4,explain:`До начала беседы разъясните права, в том числе ст. 51 Конституции РФ.`,source:`ст. 51 Конституции РФ; ст. 144 УПК РФ`},R_LEADING:{title:`Наводящий вопрос`,category:`interview`,severity:`minor`,penalty:2,explain:`Наводящий вопрос подсказывает ответ: свидетель начинает повторять вашу версию, показания «загрязняются».`,source:h},R_PRESSURE:{title:`Давление на опрашиваемого`,category:`interview`,severity:`major`,penalty:5,explain:`Обвинения «в лоб» и крик разрушают психологический контакт: человек замыкается.`,source:h},R_THREAT:{title:`Угроза при опросе`,category:`interview`,severity:`critical`,penalty:10,explain:`Угрозы и обман недопустимы; полученные так сведения не могут быть использованы.`,source:`ст. 9 УПК РФ`},R_SEIZE_SHOES:{title:`Изъятие обуви у племянника без процессуального оформления`,category:`procedure`,severity:`critical`,penalty:15,explain:`Обувь нельзя просто «забрать». Порядок до возбуждения дела утверждает кафедра; в демо верно — отразить и доложить руководителю.`,source:h},R_NOT_IN_PROTOCOL:{title:`Изъятое не отражено в протоколе`,category:`documentation`,severity:`critical`,penalty:10,explain:`Всё изъятое описывается в протоколе с индивидуальными признаками (ст. 177 УПК РФ).`,source:`ст. 166, 177, 180 УПК РФ`},R_CONCLUSION:{title:`Вывод в описательной части протокола`,category:`documentation`,severity:`minor`,penalty:2,explain:`Протокол описывает, а не оценивает: «вещество бурого цвета», а не «кровь»; «повреждений нет», а не «взлома не было».`,source:h},R_CHANGES_NOT_IN_PROTOCOL:{title:`Изменения обстановки не отражены в протоколе`,category:`documentation`,severity:`major`,penalty:4,explain:`Кто и что изменил до начала осмотра — отражается в протоколе.`,source:h},R_NOT_PRESENTED:{title:`Изъятое не предъявлено участникам осмотра`,category:`procedure`,severity:`minor`,penalty:2,explain:`Всё обнаруженное и изъятое предъявляется участникам осмотра (ст. 177 УПК РФ).`,source:`ст. 177 УПК РФ`}},_=[{id:`consent_neighbor`,label:`Письменное согласие соседки-заявителя`,ok:!1},{id:`consent_nephew`,label:`Согласие племянника (у него есть ключ)`,ok:!1},{id:`urgent_165`,label:`Не терпящий отлагательства случай (ч. 5 ст. 165 УПК): постановление следователя, уведомление судьи и прокурора в течение 24 часов`,ok:!0,draft:!0},{id:`no_basis`,label:`Основание не требуется — это место происшествия`,ok:!1}],v={orientingMaxFocal:35,overviewMaxFocal:35,overviewMinShare:4e-4,overviewMaxDist:7,nodeMinShare:.02,nodeMaxShare:.3,detailMinShare:.25,detailMaxAxisDeg:15},y={weights:{procedure:25,completeness:25,photo:20,interview:15,protocol:15},criticalCap:59,majorsOnOneEvidenceCap:74,grades:[{min:90,label:`отлично`},{min:75,label:`хорошо`},{min:60,label:`удовлетворительно`},{min:0,label:`неудовлетворит
